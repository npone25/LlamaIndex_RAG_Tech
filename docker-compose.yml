version: '3.8'

services:
  # 1. MÁY CHỦ DATABASE (PostgreSQL + pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_rag_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: phone_rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. GIAO DIỆN QUẢN TRỊ WEB (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
