# Workflow kiểm thử tự động trên GitHub Actions cho đồ án LlamaIndex RAG
# Tham khảo cấu trúc từ streamlit/llm-examples (.github/workflows/app-testing.yml)

name: Kiểm thử tự động (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  kiem_thu:
    name: Kiểm tra mã nguồn và chạy Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cài đặt các thư viện kiểm thử CI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Kiểm tra mã nguồn với Ruff
        run: |
          ruff check phone_advisor tests app.py ingest.py seed_sql.py update_data.py pages

      - name: Chạy kiểm thử tự động với Pytest (không cần mạng, không cần khóa API)
        run: |
          pytest
