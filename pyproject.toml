[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "loi_rag", "he_thong", "thi_nghiem"]
addopts = "-q"

[tool.ruff]
line-length = 120
# Module của dự án nằm ở thư mục gốc, loi_rag/ và thi_nghiem/ (để sắp xếp import đúng nhóm)
src = [".", "loi_rag", "thi_nghiem"]

[tool.ruff.lint]
select = ["E", "F", "I"]
exclude = ["thi_nghiem", "_cu", ".venv"]

[tool.pyright]
# Cho VS Code (Pylance) biết module của dự án nằm ở loi_rag/ và thi_nghiem/;
# lúc chạy, đường dẫn này do _duong_dan.py và app.py thêm vào sys.path
extraPaths = ["loi_rag", "thi_nghiem"]
